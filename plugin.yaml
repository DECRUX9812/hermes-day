name: hermes-day
version: 0.1.0
description: >-
  Full-screen day cockpit for Hermes Desktop. Triages everything waiting on
  you — approvals, clarifies, input prompts — across every profile, bot and
  remote connection, plus in-flight sessions, finished runs to review, and
  scheduled jobs. One screen to manage your whole Hermes day.
author: DECRUX9812
license: MIT
homepage: https://github.com/DECRUX9812/hermes-day
requires_hermes: ">=0.1.0"
kind: standalone
tags:
  - desktop
  - inbox
  - triage
  - approvals
  - day-management
provides_tools: []
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - transform_tool_result
  - pre_verify
  - on_session_finalize
provides_middleware: []
requires_env: []
config_schema:
  gate:
    type: dict
